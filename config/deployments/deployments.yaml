- metadata:
    labels:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/name: ceph-csi-operator
      control-plane: controller-manager
    name: ceph-csi-controller-manager
  spec:
    replicas: 1
    selector:
      matchLabels:
        control-plane: ceph-csi-op-controller-manager
    strategy: {}
    template:
      metadata:
        annotations:
          kubectl.kubernetes.io/default-container: manager
        labels:
          control-plane: ceph-csi-op-controller-manager
      spec:
        containers:
        - args:
          - --leader-elect
          command:
          - /manager
          env:
          - name: OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: CSI_SERVICE_ACCOUNT_PREFIX
            value: ceph-csi-
          - name: WATCH_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['olm.targetNamespaces']
          image: quay.io/ocs-dev/cephcsi-operator:main-9bd2093
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: manager
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
        priorityClassName: openshift-user-critical
        securityContext:
          runAsNonRoot: true
        serviceAccountName: ceph-csi-controller-manager
        terminationGracePeriodSeconds: 10
        tolerations:
        - effect: NoSchedule
          key: node.ocs.openshift.io/storage
          operator: Equal
          value: "true"
  status: {}
