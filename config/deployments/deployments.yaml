- metadata:
    name: noobaa-operator
  spec:
    replicas: 1
    selector:
      matchLabels:
        noobaa-operator: deployment
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          app: noobaa
          noobaa-operator: deployment
      spec:
        containers:
        - env:
          - name: OPERATOR_NAME
            value: noobaa-operator
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: WATCH_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: NOOBAA_CORE_IMAGE
            value: quay.io/master-20260401
          - name: NOOBAA_DB_IMAGE
            value: centos/postgresql-15-centos7
          - name: NOOBAA_PSQL_12_IMAGE
            value: centos/postgresql-12-centos7
          - name: ENABLE_NOOBAA_ADMISSION
            value: "true"
          image: quay.io/noobaa/noobaa-operator:master-20260401
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: readyz
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          name: noobaa-operator
          ports:
          - containerPort: 8081
            name: readyz
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: readyz
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 250m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /readyz
              port: readyz
            periodSeconds: 10
            timeoutSeconds: 5
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
          - mountPath: /var/run/secrets/openshift/serviceaccount
            name: bound-sa-token
            readOnly: true
          - mountPath: /etc/ocp-injected-ca-bundle
            name: ocp-injected-ca-bundle
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        serviceAccountName: noobaa
        tolerations:
        - effect: NoSchedule
          key: node.ocs.openshift.io/storage
          operator: Equal
          value: "true"
        volumes:
        - name: bound-sa-token
          projected:
            sources:
            - serviceAccountToken:
                audience: openshift
                path: token
        - configMap:
            items:
            - key: ca-bundle.crt
              path: ca-bundle.crt
            name: ocp-injected-ca-bundle
            optional: true
          name: ocp-injected-ca-bundle
  status: {}
