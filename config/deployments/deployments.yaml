- metadata:
    labels:
      app.kubernetes.io/name: cloudnative-pg
    name: cnpg-controller-manager
  spec:
    replicas: 1
    selector:
      matchLabels:
        app.kubernetes.io/name: cloudnative-pg
    strategy: {}
    template:
      metadata:
        labels:
          app: noobaa
          app.kubernetes.io/name: cloudnative-pg
      spec:
        containers:
        - args:
          - controller
          - --leader-elect
          - --max-concurrent-reconciles=10
          - --config-map-name=cnpg-controller-manager-config
          - --secret-name=cnpg-controller-manager-config
          - --webhook-port=9443
          command:
          - /manager
          env:
          - name: OPERATOR_IMAGE_NAME
            value: quay.io/noobaa/cloudnative-pg-noobaa:v1.25.0
          - name: OPERATOR_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: MONITORING_QUERIES_CONFIGMAP
            value: cnpg-default-monitoring
          - name: WATCH_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: WEBHOOK_CERT_DIR
            value: /apiserver.local.config/certificates
          image: quay.io/noobaa/cloudnative-pg-noobaa:v1.25.0
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /readyz
              port: 9443
              scheme: HTTPS
          name: manager
          ports:
          - containerPort: 8080
            name: metrics
            protocol: TCP
          - containerPort: 9443
            name: webhook-server
            protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9443
              scheme: HTTPS
          resources:
            limits:
              cpu: 100m
              memory: 300Mi
            requests:
              cpu: 100m
              memory: 300Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 6
            httpGet:
              path: /readyz
              port: 9443
              scheme: HTTPS
            periodSeconds: 5
          volumeMounts:
          - mountPath: /controller
            name: scratch-data
          - mountPath: /run/secrets/cnpg.io/webhook
            name: webhook-certificates
        securityContext:
          runAsNonRoot: true
        serviceAccountName: cnpg-manager
        terminationGracePeriodSeconds: 10
        tolerations:
        - effect: NoSchedule
          key: node.ocs.openshift.io/storage
          operator: Equal
          value: "true"
        volumes:
        - emptyDir: {}
          name: scratch-data
        - name: webhook-certificates
          secret:
            defaultMode: 420
            optional: true
            secretName: cnpg-webhook-cert
  status: {}
