          app.kubernetes.io/version: v6.0.1.1
          control-plane: controller-manager
        name: ibm-spectrum-scale-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/instance: ibm-spectrum-scale
              app.kubernetes.io/name: operator
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              labels:
                app.kubernetes.io/instance: ibm-spectrum-scale
                app.kubernetes.io/name: operator
                app.kubernetes.io/version: v6.0.1.1
                control-plane: controller-manager
            spec:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
                    weight: 10
                  - preference:
                      matchExpressions:
                      - key: scale.spectrum.ibm.com/controller-manager
                        operator: Exists
                    weight: 100
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values:
                        - linux
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                        - amd64
                        - ppc64le
                        - s390x
                        - arm64
              containers:
              - args:
                - --config=/config/controller_manager_config.yaml
                - --zap-log-level=1
                command:
                - /manager
                env:
                - name: GOVMOMI_HOME
                  value: /tmp
                - name: GOMEMLIMIT
                  valueFrom:
                    resourceFieldRef:
                      divisor: "0"
                      resource: limits.memory
                - name: OPERATOR_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                image: icr.io/cpopen/ibm-spectrum-scale-operator@sha256:85b94f637d534e031e8b1c92823826fa060408dc2779049d2b08895be29e2935
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 9443
                  name: webhook-server
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 1500m
                    memory: 400Mi
                  requests:
                    cpu: 500m
                    memory: 200Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  privileged: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                volumeMounts:
                - mountPath: /tmp/k8s-webhook-server/serving-certs
                  name: cert
                  readOnly: true
                - mountPath: /config
                  name: manager-config
                - mountPath: /etc/ssl/service
                  name: cabundle
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: ibm-spectrum-scale-operator
              terminationGracePeriodSeconds: 10
              tolerations:
              - effect: NoSchedule
                key: node-role.kubernetes.io/control-plane
                operator: Exists
              - effect: NoSchedule
                key: node-role.kubernetes.io/master
                operator: Exists
              topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: ibm-spectrum-scale
                    app.kubernetes.io/name: operator
                maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
              volumes:
              - name: cert
                secret:
                  defaultMode: 420
                  secretName: ibm-spectrum-scale-webhook-service-cert
              - configMap:
                  name: ibm-spectrum-scale-manager-config
                name: manager-config
              - configMap:
                  name: ibm-spectrum-scale-cabundle
                  optional: true
                name: cabundle
