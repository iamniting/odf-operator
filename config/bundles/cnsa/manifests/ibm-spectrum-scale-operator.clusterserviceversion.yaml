  description: |
    **IBM Storage Scale container native is a containerized version of IBM Storage Scale
    ### IBM Storage Scale
    IBM Storage Scale is a clustered file system that provides concurrent access to a single file system or set of file systems from multiple nodes.
    The nodes can be SAN attached, network attached, or a mixture of SAN attached and network attached.
    IBM Storage Scale enables high-performance access to this common set of data to support a scale-out solution or to provide a high availability platform.
    For more information about IBM Storage Scale features, see Product overview in [IBM Storage Scale documentation][1].

    IBM Storage Scale container native allows the deployment of IBM Storage Scale in a Red Hat OpenShift cluster.
    IBM Storage Scale container native deployment makes a persistent data store available by either IBM Storage Scale remote file system or local file system.
    This data store can be used by the applications through the IBM Storage Scale CSI driver by using Persistent Volumes (PVs).
    For more information, see [IBM Storage Scale Container Storage Interface Driver][2] in the IBM Storage Scale CSI documentation.

    [1]: https://www.ibm.com/docs/en/storage-scale/6.0.0
    [2]: https://www.ibm.com/docs/en/scalecsi/3.0.0
